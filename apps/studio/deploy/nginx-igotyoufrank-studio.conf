# 贴进 radar.conf(igotyoufrank.cn 主域)的 443 server 块内的 location 段。
# 不是独立 server:与 radar 的 / (→127.0.0.1:3000) 共存于同一 443 server。
# upstream mkt_backend 定义在 nginx-mkt.conf,同 nginx 实例内共享。
# GeeLark 回调走裸 IP :8080(nginx-mkt.conf),与此段无关、不受影响。
#
# 2026-07-17 前端合并:studio 页面由 svm-web(Next :3000)承载,本文件只反代
# 后端直通三类路径(api / healthz / static)+ 两个 SSE 免缓冲端点。页面路径
# (/studio、/studio/accounts、/zh/studio/* 等)不再命中这里,落入 location /
# 由 Next 处理(旧无 locale 路径由 Next middleware 302 补 locale)。
# ⚠ 此路径清单必须与 apps/web/middleware.ts 的 matcher 排除清单一致
#   (studio/api|studio/healthz|studio/static),改动要两处同步。

    # ---- GeeLark Studio API(igotyoufrank.cn/studio/api → uvicorn :18080)----
    # (2026-07-17 移除了 publish-stream 的免缓冲段:该端点后端早已删除、
    #  前端无调用方,残留 location 曾让未知路径拿到 SPA 壳的 200 误导冒烟。)

    # SSE / 长任务:免缓冲(正则 location 的 proxy_pass 不能带 URI,用 rewrite 剥前缀)
    location ~ ^/studio/api/groups/[0-9]+/phones/create$ {
        rewrite ^/studio(/.*)$ $1 break;
        proxy_pass http://mkt_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 主通路。client_max_body_size 2048m 服务 /api/videos/upload 大视频。
    location /studio/api/ {
        rewrite ^/studio(/.*)$ $1 break;
        proxy_pass http://mkt_backend;
        client_max_body_size 2048m;
        client_body_timeout 600s;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # 健康灯(侧栏 30s 轮询)与缩略图静态(带鉴权)
    location = /studio/healthz {
        rewrite ^/studio(/.*)$ $1 break;
        proxy_pass http://mkt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /studio/static/ {
        rewrite ^/studio(/.*)$ $1 break;
        proxy_pass http://mkt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

