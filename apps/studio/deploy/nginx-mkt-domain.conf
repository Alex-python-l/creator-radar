# mkt.igotyoufrank.cn — 门户统一后(2026-07)全量 301 到 igotyoufrank.cn/studio
#
# geelark-studio 已并入 creator-radar,正式入口改为
# igotyoufrank.cn/studio(nginx strip-prefix 反代到同一个 uvicorn
# 127.0.0.1:18080;片段见 apps/studio/deploy/nginx-igotyoufrank-studio.conf,
# 并入服务器上 radar.conf 的 443 server)。本文件不再反代 mkt_backend——
# 80 段仍保留 acme challenge + 跳 https;443 段只做 301,证书继续保留续期
# (避免旧书签/外链 404,也省得动证书流程)。
#
# GeeLark 回调走裸 IP :8080(nginx-mkt.conf,定义 mkt_backend upstream),
# 与本文件无关、不受这次改动影响,不要动。
#
# Cert: standalone certificate named mkt.igotyoufrank.cn (kept separate
# from the igotyoufrank.cn cert that creator-radar owns), issued via
#   certbot certonly --webroot -w /var/www/letsencrypt \
#     --cert-name mkt.igotyoufrank.cn -d mkt.igotyoufrank.cn
# Renewal is automatic: certbot.timer + the reload-nginx deploy hook.

server {
    listen 80;
    listen [::]:80;
    server_name mkt.igotyoufrank.cn;

    # Cert issuance/renewal (webroot challenge) stays on port 80.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mkt.igotyoufrank.cn;

    ssl_certificate     /etc/letsencrypt/live/mkt.igotyoufrank.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mkt.igotyoufrank.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 门户统一后:全部 301 到主域 /studio。证书保留续期,GeeLark 回调走 :8080 不受影响。
    location / {
        return 301 https://igotyoufrank.cn/studio$request_uri;
    }
}
