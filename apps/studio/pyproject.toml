[project]
name = "geelark-studio"
version = "0.1.0"
description = "Self-contained web application for managing TikTok accounts via GeeLark cloud-phone API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.31",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "procrastinate>=2.10",
    "itsdangerous>=2.0.0",
    "gdown>=5.2.0",
    "cryptography>=48.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "responses>=0.26.1",
    "ruff>=0.6.0",
]

[tool.uv]
package = false  # this is an app, not a library
constraint-dependencies = [
    "pyasn1>=0.6.4",
    "starlette>=1.3.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Conservative baseline: pyflakes (F) + pycodestyle errors (E) + import sorting (I).
# Expand rule sets in future PRs once baseline is clean.
select = ["F", "E", "I"]
# Existing violations deferred to follow-up PRs — do not mass-touch business code in a
# tooling PR. Each rule is documented with its initial count so ratcheting is easy later.
ignore = [
    "I001",  # 100 hits — import block un-sorted; fix in dedicated import-sort PR
    "E702",  # 20 hits  — multiple statements on one line (semicolon); test style
    "E501",  # 12 hits  — line too long (>100); defer line-length cleanup
    "F841",  # 10 hits  — local variable assigned but never used; test scaffolding
    "E701",  #  4 hits  — multiple statements on one line (colon); geelark_client style
    "E401",  #  4 hits  — multiple imports on one line; defer
    "E402",  #  2 hits  — module level import not at top of file; intentional lazy imports
    "F401",  #  4 hits  — imported but unused; test fixtures + intentional re-exports
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "no_auto_prompt: skip the conftest fixture that auto-binds a default caption prompt to every newly created group",
]
