[project]
name = "scraper"
version = "0.1.0"
description = "Creator Radar 抓取服务 — FastAPI + Postgres jobs worker"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.32.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "httpx[socks]>=0.28.0",
    "structlog>=24.4.0",
    "yt-dlp>=2026.6.9",
    "instagrapi>=2.6.9",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.uv]
package = false
constraint-dependencies = [
    "pillow>=12.3.0",
    "starlette>=1.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
